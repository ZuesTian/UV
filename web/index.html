<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4ed" />
    <meta name="description" content="UV-Vis 光谱基线积分与多文件对比工作台" />
    <title>UV Spectrum · 在线光谱积分</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar shell">
      <a class="brand" href="https://zuestian.github.io/Cnanotools/">← CNT LAB</a>
      <span>UV–VIS SPECTRUM WORKBENCH</span>
      <a href="https://github.com/ZuesTian/UV" target="_blank" rel="noreferrer">SOURCE ↗</a>
    </header>

    <main class="shell">
      <section class="hero">
        <div><p class="eyebrow">SPECTRAL INTEGRATION / 06</p><h1>从吸收曲线中，<br /><em>量出峰的贡献。</em></h1></div>
        <p>在浏览器内完成多光谱叠加、拖拽选区、线性基线扣除、峰面积记录与 CSV 汇总。数据不会离开当前设备。</p>
      </section>

      <section class="workspace">
        <aside class="sidebar panel">
          <div class="section-title"><span>01</span><h2>光谱文件</h2></div>
          <label class="upload" id="dropzone"><input id="fileInput" type="file" accept=".txt,.csv,.dat,text/plain,text/csv" multiple /><b>添加光谱文件</b><small>可多选或拖入 · 两列数据</small></label>
          <div class="file-list" id="fileList"><p>尚未加载文件</p></div>

          <div class="section-title range-title"><span>02</span><h2>积分范围</h2></div>
          <div class="range-grid"><label>起点<input id="rangeMin" type="number" step="any" /></label><label>终点<input id="rangeMax" type="number" step="any" /></label></div>
          <p class="hint">也可以直接在图中横向拖拽选区。</p>
          <button class="primary" id="calculateButton" disabled>计算当前范围 <b>→</b></button>
          <div class="current-result" id="currentResult" hidden><small>基线校正面积</small><strong id="correctedArea">—</strong><div><span>原始 <b id="rawArea">—</b></span><span>正面积 <b id="positiveArea">—</b></span></div></div>
        </aside>

        <section class="content panel">
          <div class="content-head"><div class="section-title"><span>03</span><h2>光谱与选区</h2></div><div class="actions"><button id="recordButton" disabled>记录为峰</button><button id="exportButton" disabled>导出汇总</button></div></div>
          <div class="empty" id="empty"><i></i><p>添加一个或多个光谱文件开始分析。</p></div>
          <div id="analysis" hidden>
            <div class="chart-wrap"><svg id="chart" viewBox="0 0 1040 500" aria-label="光谱曲线图"></svg><div class="chart-tip">拖拽图表选择积分区间</div></div>
            <div class="records-head"><h3>峰记录</h3><span id="recordCount">0 条记录</span></div>
            <div class="table-wrap"><table><thead><tr><th>文件</th><th>峰名称</th><th>范围</th><th>校正面积</th><th>正面积</th><th></th></tr></thead><tbody id="recordRows"><tr><td colspan="6">尚未记录峰</td></tr></tbody></table></div>
          </div>
          <div class="message" id="message" hidden></div>
        </section>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
